<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --stone: #4a3f31; --stone-hi: #6b5a43; --stone-lo: #2a231a; --tile: #3a3126;
    --tile-hi: #5a4b38; --tile-lo: #1d1812; --gold: #ffd84a; --yellow: #ffff3a;
    --orange: #ff9a1f; --text: #f3e6c4; --green: #3fd16a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
  body { font-family: "VT323", "Menlo", monospace; color: var(--text); }
  .panel {
    padding: 6px; border-radius: 6px;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.05) 0 2px, transparent 3px) 0 0/13px 11px,
      radial-gradient(circle at 70% 60%, rgba(0,0,0,.12) 0 2px, transparent 3px) 0 0/17px 15px,
      linear-gradient(180deg, var(--stone-hi), var(--stone) 30%, #3f3528);
    border: 2px solid var(--stone-lo);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.18), inset -1px -1px 0 rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.45);
  }
  .bar { height: 18px; display: flex; align-items: center; justify-content: space-between; padding: 0 2px 4px; }
  .title { color: var(--orange); font-size: 17px; text-shadow: 1px 1px 0 #000; letter-spacing: .5px; }
  .btn { color: var(--text); opacity: .55; font-size: 13px; width: 14px; text-align: center; text-shadow: 1px 1px 0 #000; }
  .btn:hover { opacity: 1; color: var(--yellow); }
  .inset { background: rgba(18,14,9,.72); border: 1px solid #000; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }

  .hero { display: flex; gap: 6px; padding: 4px; margin-bottom: 4px; }
  .stage { width: 76px; height: 92px; flex: none; position: relative; border-radius: 2px;
           background: radial-gradient(ellipse at 50% 92%, rgba(0,0,0,.55) 0 18%, transparent 19%), linear-gradient(180deg, #241d15, #15110c); }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; shape-rendering: crispEdges; }
  .stage .aura { position: absolute; inset: 6px 10px 4px; border-radius: 50%; filter: blur(9px); opacity: .55; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .9; transform: scale(1.06); } }
  .glow { animation: shimmer 1.8s ease-in-out infinite; }
  @keyframes shimmer { 50% { filter: brightness(1.5) drop-shadow(0 0 2px #fff); } }
  .side { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .rank { color: var(--orange); font-size: 18px; line-height: 1; text-shadow: 1px 1px 0 #000; }
  .sub { font-size: 13px; color: #c9b993; text-shadow: 1px 1px 0 #000; margin-bottom: 3px; }
  .slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
  .slot { height: 22px; border: 1px solid #000; border-radius: 2px; display: grid; place-items: center; font-size: 13px;
          background: linear-gradient(180deg, #3b3227, #262019); box-shadow: inset 1px 1px 0 rgba(255,255,255,.1); position: relative; }
  .slot i { position: absolute; left: 2px; right: 2px; bottom: 2px; height: 3px; border-radius: 1px; }
  .slot:hover { background: linear-gradient(180deg, #5c4c39, #3a3125); }
  .goal { margin-top: auto; font-size: 13px; line-height: 1.05; color: var(--text); text-shadow: 1px 1px 0 #000; }
  .goal b { color: var(--yellow); font-weight: normal; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .tile { position: relative; height: 34px; display: flex; align-items: center; gap: 2px; padding: 0 5px 0 4px;
          background: linear-gradient(180deg, var(--tile-hi), var(--tile) 45%, #2f281f);
          border: 1px solid var(--tile-lo); border-radius: 3px;
          box-shadow: inset 1px 1px 0 rgba(255,255,255,.12), inset -1px -1px 0 rgba(0,0,0,.4); }
  .tile:hover { background: linear-gradient(180deg, #74624a, #4a3e2f 45%, #3a3125); }
  .icon { font-size: 17px; width: 22px; text-align: center; filter: drop-shadow(1px 1px 0 #000) saturate(.85); }
  .lv { flex: 1; position: relative; height: 26px; }
  .lv .a, .lv .b { position: absolute; font-size: 18px; color: var(--yellow); text-shadow: 1px 1px 0 #000; line-height: 1; }
  .lv .a { top: 1px; left: 2px; } .lv .b { bottom: 0; right: 0; }
  .lv .slash { position: absolute; left: 50%; top: 50%; width: 1px; height: 22px; background: rgba(0,0,0,.55);
               transform: translate(-50%, -50%) rotate(35deg); box-shadow: 1px 0 0 rgba(255,255,255,.12); }
  .today { position: absolute; top: 2px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--green); box-shadow: 0 0 4px var(--green); }
  .tile.total { justify-content: center; flex-direction: column; gap: 0; }
  .tile.total .k { font-size: 12px; white-space: nowrap; color: var(--yellow); text-shadow: 1px 1px 0 #000; }
  .tile.total .v { font-size: 18px; color: var(--yellow); text-shadow: 1px 1px 0 #000; line-height: 1; }

  .info { margin-top: 5px; padding: 5px 6px; font-size: 15px; line-height: 1.1; }
  .info .name { color: var(--orange); font-size: 16px; text-shadow: 1px 1px 0 #000; }
  .info .row { display: flex; justify-content: space-between; text-shadow: 1px 1px 0 #000; }
  .info .row span:last-child { color: var(--yellow); }
  .info .about { color: #c9b993; font-size: 13px; margin-top: 2px; }
  .xpbar { height: 7px; margin-top: 3px; background: #2a0d0d; border: 1px solid #000; position: relative; }
  .xpbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg, #57e07a, #1f9a42); }
  .compact .grid, .compact .info, .compact .hero { display: none; }
  .levelup { animation: flash 1.2s ease-out 3; }
  @keyframes flash { 0% { box-shadow: 0 0 0 2px var(--gold), 0 0 16px var(--gold); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .banner { position: fixed; left: 6px; right: 6px; top: 26px; padding: 8px; text-align: center; border-radius: 3px; z-index: 5;
            background: rgba(12,9,5,.94); border: 1px solid var(--gold); color: var(--yellow); text-shadow: 1px 1px 0 #000;
            font-size: 15px; opacity: 0; transform: translateY(-6px); transition: all .25s; pointer-events: none; }
  .banner.show { opacity: 1; transform: none; }
  .banner .big { font-size: 20px; color: var(--orange); }

  /* ---- loot: chips, tray, overlay, unboxing, bag ---- */
  .bar { gap: 4px; }
  #chips { display: flex; gap: 3px; margin-left: auto; margin-right: 4px; }
  .chip { font-size: 14px; color: var(--yellow); text-shadow: 1px 1px 0 #000; padding: 0 4px; height: 16px; line-height: 16px;
          background: rgba(0,0,0,.35); border: 1px solid #000; border-radius: 3px; white-space: nowrap; }
  .chip.warn { color: #ffb4a0; }
  .chip.boost { color: #9dffb5; animation: pulse 1.6s infinite; }
  .btn2 { cursor: pointer; } .btn2:hover { background: rgba(255,216,74,.25); }
  .flame { display: inline-block; font-size: 11px; }
  .flame.f1 { font-size: 13px; animation: flick .5s infinite alternate; }
  .flame.f2 { font-size: 15px; animation: flick .4s infinite alternate; filter: drop-shadow(0 0 3px #ff8a00); }
  .flame.f3 { font-size: 16px; animation: flick .35s infinite alternate; filter: hue-rotate(190deg) drop-shadow(0 0 4px #4fc3ff); }
  @keyframes flick { to { transform: translateY(-1px) scale(1.08); } }

  #tray { display: none; align-items: center; gap: 6px; padding: 4px 6px; margin-bottom: 4px; cursor: pointer; position: relative; overflow: hidden;
          background: linear-gradient(180deg, #4a3a1c, #2b2110); border: 1px solid #000; border-radius: 3px;
          box-shadow: inset 0 0 0 1px rgba(255,216,74,.35), 0 0 8px rgba(255,216,74,.35); animation: trayGlow 1.8s ease-in-out infinite; }
  #tray::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40px; left: -60px;
                 background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); animation: sweep 2.6s ease-in-out infinite; }
  @keyframes sweep { 60%, 100% { left: 110%; } }
  @keyframes trayGlow { 50% { box-shadow: inset 0 0 0 1px rgba(255,216,74,.6), 0 0 14px rgba(255,216,74,.6); } }
  #tray .mini { width: 30px; height: 26px; animation: bob 1.2s ease-in-out infinite; }
  #tray .mini svg { width: 100%; height: 100%; }
  @keyframes bob { 50% { transform: translateY(-2px) rotate(-3deg); } }
  .trayText { flex: 1; font-size: 15px; line-height: 1; color: var(--text); text-shadow: 1px 1px 0 #000; }
  .meter { height: 6px; margin-top: 3px; background: #1a120a; border: 1px solid #000; position: relative; }
  .meter i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #e0a826, #ffe58a); box-shadow: 0 0 6px #ffd84a; }
  #tray.idle { cursor: default; animation: none; box-shadow: inset 0 0 0 1px rgba(255,216,74,.15); }
  #tray.idle::after { display: none; }
  .trayText b { color: var(--yellow); font-weight: normal; } .trayText small { font-size: 12px; color: #c9b993; }
  .openBtn, .gb { font-size: 15px; color: #1d1405; background: linear-gradient(180deg, #ffe58a, #e0a826); border: 1px solid #000;
                 border-radius: 3px; padding: 1px 8px; box-shadow: inset 0 1px 0 #fff6c8; cursor: pointer; white-space: nowrap; }
  .gb:hover, .openBtn:hover { filter: brightness(1.15); }
  .gb.alt { background: linear-gradient(180deg, #8fc8ff, #3b7fd6); }
  .gb.sm { font-size: 13px; padding: 0 6px; } .gb.dis { filter: grayscale(1) brightness(.6); cursor: default; }

  .overlay { position: fixed; inset: 0; z-index: 10; display: none; background: rgba(8,6,3,.985); border-radius: 6px; overflow: hidden; }
  .overlay.show { display: block; }
  .ubox { height: 100%; display: flex; flex-direction: column; align-items: center; padding: 10px 6px; text-align: center; }
  .utitle { font-size: 22px; text-shadow: 1px 1px 0 #000; } .usrc { font-size: 14px; color: #c9b993; margin-bottom: 6px; }
  .stageC { position: relative; width: 150px; height: 130px; cursor: pointer; transition: all .4s; display: grid; place-items: center; }
  .stageC .chest { width: 110px; image-rendering: pixelated; filter: drop-shadow(0 0 10px rgba(255,216,74,.5)); animation: bob 1.4s ease-in-out infinite; }
  .stageC .hint { position: absolute; bottom: -4px; font-size: 15px; color: var(--yellow); animation: pulse 1.2s infinite; }
  .stageC.small { height: 60px; } .stageC.small .chest { width: 56px; }
  .chest.shake { animation: shake .7s linear; }
  @keyframes shake { 10%,30%,50%,70%,90% { transform: translateX(-3px) rotate(-3deg); } 20%,40%,60%,80% { transform: translateX(3px) rotate(3deg); } }
  .chest .lid { transition: transform .35s cubic-bezier(.3,1.6,.5,1); transform-origin: 3px 13px; }
  .chest.open .lid { transform: translate(-2px,-7px) rotate(-28deg); }
  .stageC.burst::before { content: ""; position: absolute; inset: -60px; z-index: -1;
      background: repeating-conic-gradient(from 0deg, rgba(255,216,74,.35) 0 8deg, transparent 8deg 22deg);
      border-radius: 50%; animation: rays 6s linear infinite, fadeIn .4s; mask: radial-gradient(circle, #000 20%, transparent 70%); }
  @keyframes rays { to { transform: rotate(360deg); } } @keyframes fadeIn { from { opacity: 0; transform: scale(.3); } }
  .reelWrap { position: relative; width: 100%; height: 66px; overflow: hidden; margin-top: 6px; opacity: 0; transition: opacity .3s;
              border-top: 2px solid #000; border-bottom: 2px solid #000; background: linear-gradient(90deg, #0c0905, #241b10 30%, #241b10 70%, #0c0905); }
  .reelWrap.show { opacity: 1; }
  .marker { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--gold); z-index: 2; box-shadow: 0 0 6px var(--gold); transform: translateX(-1px); }
  .reel { display: flex; gap: 4px; padding: 5px 0; will-change: transform; }
  .card { flex: none; width: 42px; height: 54px; border-radius: 3px; border: 1px solid #000; display: flex; flex-direction: column; align-items: center;
          background: linear-gradient(180deg, #3b3227, #1d1812); box-shadow: inset 0 -3px 0 var(--rc), inset 0 0 0 1px rgba(255,255,255,.08); }
  .card .ci { font-size: 22px; margin-top: 3px; } .card .cn { font-size: 9px; line-height: 1; color: #ddd; padding: 1px; overflow: hidden; height: 18px; }
  .card.winner { transform: scale(1.15); box-shadow: inset 0 -3px 0 var(--rc), 0 0 12px var(--rc), 0 0 0 2px var(--rc); z-index: 3; transition: all .3s; }
  .card.winner.r-extraordinary { animation: rainbow 1s linear infinite; }
  @keyframes rainbow { 0% { box-shadow: 0 0 14px #ff5f5f, 0 0 0 2px #ff5f5f; } 33% { box-shadow: 0 0 14px #ffd84a, 0 0 0 2px #ffd84a; }
                       66% { box-shadow: 0 0 14px #5fd0ff, 0 0 0 2px #5fd0ff; } 100% { box-shadow: 0 0 14px #ff5fd2, 0 0 0 2px #ff5fd2; } }
  .result { opacity: 0; transform: translateY(8px); transition: all .4s; margin-top: 6px; }
  .result.show { opacity: 1; transform: none; }
  .rname { font-size: 24px; text-shadow: 1px 1px 0 #000, 0 0 10px currentColor; letter-spacing: 1px; animation: pop .5s cubic-bezier(.3,1.8,.5,1); }
  .rname.r-extraordinary { background: linear-gradient(90deg, #ff5f5f, #ffd84a, #5fd0ff, #ff5fd2, #ff5f5f); background-size: 200%;
                           -webkit-background-clip: text; color: transparent !important; animation: pop .5s, slide 1.5s linear infinite; }
  @keyframes slide { to { background-position: 200%; } } @keyframes pop { from { transform: scale(.2); } }
  .result .big { font-size: 18px; color: var(--yellow); text-shadow: 1px 1px 0 #000; }
  .result .what { font-size: 14px; color: #c9b993; margin: 2px 0; } .result .bonus { font-size: 14px; color: #ffe58a; }
  .btns { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
  .conf { position: absolute; top: 45%; width: 5px; height: 5px; z-index: 4; animation: conf 1.8s cubic-bezier(.2,.7,.4,1) forwards; }
  @keyframes conf { to { transform: translate(var(--dx), var(--dy)) rotate(540deg); opacity: 0; } }

  .bag { height: 100%; display: flex; flex-direction: column; padding: 6px; }
  .bagTop { display: flex; gap: 3px; align-items: center; }
  .tab { font-size: 15px; padding: 1px 7px; border: 1px solid #000; border-radius: 3px 3px 0 0; background: #2a231a; color: #c9b993; cursor: pointer; }
  .tab.on { background: #5a4b38; color: var(--yellow); } .x { margin-left: auto; cursor: pointer; color: #c9b993; font-size: 14px; } .x:hover { color: var(--yellow); }
  .coins { font-size: 15px; color: var(--yellow); margin: 4px 0; text-shadow: 1px 1px 0 #000; }
  .list { flex: 1; overflow-y: auto; padding-right: 2px; }
  .list::-webkit-scrollbar { width: 5px; } .list::-webkit-scrollbar-thumb { background: #5a4b38; }
  .it { display: flex; align-items: center; gap: 5px; padding: 3px 4px; margin-bottom: 2px; border-radius: 3px; background: rgba(255,255,255,.04);
        border-left: 3px solid var(--rc); }
  .it .ii { font-size: 18px; width: 22px; text-align: center; } .it .in { flex: 1; font-size: 14px; line-height: 1.05; color: var(--text); }
  .it small { display: block; font-size: 11px; color: #a8987a; } .it.locked { opacity: .45; }
  .mini2 svg { width: 22px; height: 19px; }
  .sec { font-size: 13px; color: var(--orange); margin: 5px 0 2px; } .empty, .qty { font-size: 13px; color: #a8987a; }
  .pet { position: absolute; right: 2px; bottom: 4px; font-size: 18px; animation: bob 1.1s ease-in-out infinite; filter: drop-shadow(1px 1px 0 #000); }
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="bar"><span class="title" id="title">Skills</span><span id="chips"></span><span class="btn" id="fold" title="Fold">▾</span></div>
  <div class="hero inset">
    <div class="stage" id="stage"></div>
    <div class="side">
      <div class="rank" id="rank"></div>
      <div class="sub" id="sub"></div>
      <div class="slots" id="slots"></div>
      <div class="goal" id="goal"></div>
    </div>
  </div>
  <div id="tray"></div>
  <div class="grid" id="grid"></div>
  <div class="info inset" id="info"></div>
</div>
<div class="banner" id="banner"></div>
<div class="overlay" id="overlay"></div>
<script src="loot.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Math.round(n).toLocaleString("en-US");
  const post = (msg) => window.webkit?.messageHandlers?.panel?.postMessage(msg);
  const SLOT_ICON = { helm: "⛑️", body: "🛡️", amulet: "📿", cape: "🧣", weapon: "🗡️" };
  let stats = null, hovered = null, known = null;

  // ---- gear ----
  const tierIndex = (lv) => { let i = 0; stats.tiers.forEach((t, k) => { if (lv >= t.level) i = k; }); return i; };
  const tierOf = (s) => stats.tiers[tierIndex(s.level)];
  const itemName = (s, t) => (t.legend ? s.gear.legend : `${t.name} ${s.gear.item}`);
  const nextTier = (s) => stats.tiers[tierIndex(s.level) + 1];
  const xpAt = (lv) => stats.curve[lv];
  const bySlot = (slot) => stats.skills.find((s) => s.gear?.slot === slot);

  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.max(0, Math.min(255, Math.round(v * k))));
    return "#" + c.map((v) => v.toString(16).padStart(2, "0")).join("");
  }
  const R = (x, y, w, h, c, cls = "") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" class="${cls}"/>`;

  function hero() {
    const g = {};
    for (const slot of ["helm", "body", "amulet", "cape", "weapon"]) {
      const s = bySlot(slot);
      g[slot] = s ? { t: tierOf(s), i: tierIndex(s.level) } : { t: stats.tiers[0], i: 0 };
    }
    const skin = "#e2b48c", skinD = "#b98a63", pants = "#4b3a2a", boot = "#2a1f16";
    let o = "";
    // cape (behind): grows longer and gets a trim as it upgrades
    { const { t, i } = g.cape, len = 14 + Math.min(i, 8), cls = t.glow ? "glow" : "";
      o += R(9, 14, 14, len, shade(t.color, .8), cls) + R(10, 14, 12, len - 1, t.color, cls);
      if (t.trim) o += R(9, 13 + len, 14, 1, t.trim, cls); }
    // legs and boots
    o += R(12, 27, 3, 9, pants) + R(17, 27, 3, 9, pants) + R(11, 35, 4, 3, boot) + R(17, 35, 4, 3, boot);
    // body armour
    { const { t, i } = g.body, c = t.color, cls = t.glow ? "glow" : "";
      o += R(10, 14, 12, 13, c, cls) + R(10, 14, 1, 13, shade(c, 1.25), cls) + R(21, 14, 1, 13, shade(c, .7), cls);
      if (i >= 1) o += R(10, 25, 12, 2, shade(c, .6), cls) + R(15, 25, 2, 2, t.trim || "#d6b24a", cls);   // belt
      if (i >= 3) o += R(8, 14, 4, 3, shade(c, 1.15), cls) + R(20, 14, 4, 3, shade(c, 1.15), cls);    // pauldrons
      if (i >= 5) o += R(13, 17, 6, 1, t.trim || shade(c, 1.4), cls) + R(15, 17, 2, 6, t.trim || shade(c, 1.4), cls); // crest
    }
    // arms
    { const c = g.body.i >= 2 ? shade(g.body.t.color, .9) : "#7a5c3e";
      o += R(8, 17, 2, 8, c) + R(22, 17, 2, 8, c) + R(8, 25, 2, 2, skin) + R(22, 25, 2, 2, skin); }
    // head
    o += R(12, 4, 8, 10, skin) + R(12, 12, 8, 2, skinD) + R(14, 8, 1, 2, "#111") + R(17, 8, 1, 2, "#111");
    // helm: hood at cloth, metal helm above, visor, plume, then a crown
    { const { t, i } = g.helm, c = t.color, cls = t.glow ? "glow" : "";
      if (i === 0) o += R(11, 3, 10, 4, c) + R(11, 3, 1, 9, c) + R(20, 3, 1, 9, c);
      else {
        o += R(11, 2, 10, 5, c, cls) + R(11, 2, 10, 1, shade(c, 1.3), cls) + R(11, 7, 2, 5, shade(c, .85), cls) + R(19, 7, 2, 5, shade(c, .85), cls);
        if (i >= 4) o += R(13, 7, 6, 1, shade(c, .5), cls);                           // visor brow
        if (i >= 7) o += R(15, 0, 2, 2, t.trim || "#d33", cls) + R(16, -1, 3, 1, t.trim || "#d33", cls); // plume
        if (t.legend) o += R(11, 0, 1, 2, t.trim, cls) + R(15, -1, 2, 3, t.trim, cls) + R(20, 0, 1, 2, t.trim, cls); // crown
      } }
    // amulet
    { const { t, i } = g.amulet, cls = t.glow ? "glow" : "";
      o += R(14, 14, 1, 2, "#8a7a55") + R(17, 14, 1, 2, "#8a7a55") + R(15, 16, 2, 2 + (i >= 6 ? 1 : 0), t.color, cls); }
    // weapon: stick, then a blade that grows, gains a guard, then a glowing edge
    { const { t, i } = g.weapon, c = t.color, cls = t.glow ? "glow" : "";
      if (i === 0) o += R(24, 15, 1, 13, "#7a5530");
      else {
        const len = 8 + i;
        o += R(24, 26 - len, 2, len, c, cls) + R(24, 26 - len, 1, len, shade(c, 1.35), cls) + R(24, 26 - len - 1, 1, 1, shade(c, 1.35), cls);
        o += R(22, 26, 6, 1, i >= 3 ? (t.trim || "#c9a640") : "#6b4a2a", cls) + R(24, 27, 2, 2, "#5a3a20");
      } }
    const best = Object.values(g).reduce((a, b) => (b.i > a.i ? b : a));
    const eq = window.Loot ? Loot.equipped() : {};
    const auraColor = eq.aura ? Loot.drop(eq.aura).color : best.t.glow ? best.t.color : null;
    const aura = auraColor ? `<div class="aura" style="background:${auraColor}"></div>` : "";
    const pet = eq.pet ? `<span class="pet">${Loot.drop(eq.pet).icon}</span>` : "";
    return aura + `<svg viewBox="-2 -2 36 42">${o}</svg>` + pet;
  }

  function titleFor(total) { let t = stats.titles[0]?.[1] || ""; for (const [lv, name] of stats.titles) if (total >= lv) t = name; return t; }

  function nearestGoal() {
    let best = null;
    for (const s of stats.skills) {
      const nt = nextTier(s);
      if (!s.gear || !nt) continue;
      const need = xpAt(nt.level) - s.xp;
      if (!best || need < best.need) best = { s, nt, need };
    }
    return best;
  }

  // ---- info box ----
  function skillInfo(s) {
    const max = s.next_xp == null, pct = max ? 100 : (100 * (s.xp - s.level_xp)) / (s.next_xp - s.level_xp);
    return `<div class="name">${s.icon} ${s.name}</div>
      <div class="row"><span>${s.name} XP:</span><span>${fmt(s.xp)}</span></div>
      ${max ? "" : `<div class="row"><span>Next level at:</span><span>${fmt(s.next_xp)}</span></div>
      <div class="row"><span>Remaining XP:</span><span>${fmt(s.next_xp - s.xp)}</span></div>`}
      <div class="row"><span>Today:</span><span>+${fmt(s.today_xp)}</span></div>
      <div class="xpbar"><i style="width:${pct.toFixed(1)}%"></i></div>
      <div class="about">${s.about}</div>`;
  }
  function gearInfo(s) {
    const t = tierOf(s), nt = nextTier(s);
    return `<div class="name">${SLOT_ICON[s.gear.slot]} ${itemName(s, t)}</div>
      <div class="row"><span>Powered by:</span><span>${s.icon} ${s.name} ${s.level}</span></div>
      ${nt ? `<div class="row"><span>Next:</span><span>${itemName(s, nt)}</span></div>
      <div class="row"><span>Needs:</span><span>${s.name} ${nt.level}</span></div>
      <div class="row"><span>XP to go:</span><span>${fmt(xpAt(nt.level) - s.xp)}</span></div>`
      : `<div class="about">Fully ascended. Nothing left to unlock.</div>`}`;
  }
  function overview() {
    const today = stats.skills.reduce((a, x) => a + x.today_xp, 0);
    const best = [...stats.skills].sort((a, b) => b.today_xp - a.today_xp)[0];
    return `<div class="name">Total level: ${stats.total_level}</div>
      <div class="row"><span>Total XP:</span><span>${fmt(stats.total_xp)}</span></div>
      <div class="row"><span>XP today:</span><span>${fmt(today)}</span></div>
      <div class="row"><span>Best today:</span><span>${best && best.today_xp ? best.icon + " " + best.name : "-"}</span></div>
      ${stats.streak ? `<div class="row"><span>Streak:</span><span>🔥 ${stats.streak.days} days${stats.streak.today_done ? " ✓" : ""}</span></div>` : ""}`;
  }
  const infoFor = (key) => {
    const [kind, id] = (key || "").split(":");
    const s = stats.skills.find((x) => x.id === id);
    return !s ? overview() : kind === "gear" ? gearInfo(s) : skillInfo(s);
  };
  function paintInfo() { $("info").innerHTML = (typeof infoOverride === "string" && infoOverride) || infoFor(hovered); }

  // Reserve room for the tallest hover text so hovering never resizes or clips the panel.
  function reserveInfoHeight() {
    const box = $("info");
    box.style.minHeight = "0";
    let tallest = 0;
    for (const key of [null, ...stats.skills.flatMap((s) => ["skill:" + s.id, "gear:" + s.id])]) {
      box.innerHTML = infoFor(key);
      tallest = Math.max(tallest, box.getBoundingClientRect().height);
    }
    box.style.minHeight = Math.ceil(tallest) + "px";
  }
  function hover(el, key) { el.onmouseenter = () => { hovered = key; paintInfo(); }; el.onmouseleave = () => { hovered = null; paintInfo(); }; }

  // ---- render ----
  function render(data) {
    stats = data;
    const ups = [];
    if (known) for (const s of data.skills) if (known[s.id] && s.level > known[s.id]) ups.push({ s, from: known[s.id] });
    known = Object.fromEntries(data.skills.map((s) => [s.id, s.level]));

    if (window.Loot) Loot.render(data);
    $("stage").innerHTML = hero();
    const eqTitle = window.Loot && Loot.equipped().title;
    $("rank").textContent = eqTitle ? Loot.drop(eqTitle).name.replace("Title: ", "") : titleFor(data.total_level);
    $("sub").textContent = `Total level ${data.total_level}`;
    $("slots").innerHTML = data.skills.filter((s) => s.gear).map((s) => {
      const t = tierOf(s);
      return `<div class="slot" data-id="${s.id}">${SLOT_ICON[s.gear.slot] || "?"}<i style="background:${t.color}"></i></div>`;
    }).join("");
    const goal = nearestGoal();
    $("goal").innerHTML = goal ? `Next unlock: <b>${itemName(goal.s, goal.nt)}</b><br>${goal.s.name} ${goal.nt.level} · ${fmt(goal.need)} XP to go` : "Everything unlocked.";

    const upIds = ups.map((u) => u.s.id);
    $("grid").innerHTML = data.skills.map((s) => `
      <div class="tile ${upIds.includes(s.id) ? "levelup" : ""}" data-id="${s.id}">
        <span class="icon">${s.icon}</span>
        <span class="lv"><span class="a">${s.level}</span><span class="slash"></span><span class="b">${s.level}</span></span>
        ${s.today_xp > 0 ? '<span class="today"></span>' : ""}
      </div>`).join("") + `<div class="tile total"><span class="k">Total level:</span><span class="v">${data.total_level}</span></div>`;

    document.querySelectorAll(".tile[data-id]").forEach((t) => hover(t, "skill:" + t.dataset.id));
    document.querySelectorAll(".slot[data-id]").forEach((t) => hover(t, "gear:" + t.dataset.id));
    reserveInfoHeight();
    paintInfo();
    const stale = Date.now() - Date.parse(data.updated) > 10 * 60 * 1000;
    $("title").textContent = stale ? "⚠ not updating" : "Skills";
    if (ups.length) celebrate(ups);
    fit();
  }

  function celebrate(ups) {
    const { s, from } = ups[0];
    const unlocked = stats.tiers.filter((t) => t.level > from && t.level <= s.level).pop();
    $("banner").innerHTML = unlocked && s.gear
      ? `<div class="big">✨ New unlock! ✨</div>${itemName(s, unlocked)}<br>${s.icon} ${s.name} is now level ${s.level}.`
      : `<div class="big">🎉 Level up! 🎉</div>${s.icon} ${s.name} is now level ${s.level}.`;
    if (ups.length > 1) $("banner").innerHTML += `<br>+${ups.length - 1} more skill${ups.length > 2 ? "s" : ""}`;
    $("banner").classList.add("show");
    setTimeout(() => $("banner").classList.remove("show"), 7000);
    jingle(!!unlocked);
  }

  function jingle(big) {
    try {
      const ctx = new AudioContext(), notes = big ? [392, 523, 659, 784, 1047, 1319] : [523, 659, 784, 1047];
      notes.forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.12;
        o.type = "square"; o.frequency.value = f;
        g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.22);
      });
    } catch (e) {}
  }

  function fit() { requestAnimationFrame(() => post({ type: "size", height: Math.ceil($("panel").getBoundingClientRect().height) })); }
  $("fold").onclick = () => { document.body.classList.toggle("compact"); $("fold").textContent = document.body.classList.contains("compact") ? "▸" : "▾"; fit(); };
  window.render = render;
  let infoOverride = null;
  window.showInfoHTML = (html) => { infoOverride = html; paintInfo(); };
  window.repaintHero = () => { $("stage").innerHTML = hero(); const t = Loot.equipped().title;
    $("rank").textContent = t ? Loot.drop(t).name.replace("Title: ", "") : titleFor(stats.total_level); };
  window.banner = (html) => { $("banner").innerHTML = html; $("banner").classList.add("show"); setTimeout(() => $("banner").classList.remove("show"), 5000); };
  document.fonts.ready.then(() => { if (stats) { reserveInfoHeight(); paintInfo(); fit(); } });  // font changes text height
  window.showInfo = (key) => { hovered = key; paintInfo(); };
  // Preview other levels without touching real data: window.preview([10, 40, 70, 90, 99])
  window.preview = (levels) => { const d = JSON.parse(JSON.stringify(stats)); d.skills.forEach((s, i) => { s.level = levels[i] ?? s.level; }); d.total_level = d.skills.reduce((a, s) => a + s.level, 0); known = null; render(d); };
  post({ type: "ready" });
</script>
</body>
</html>
